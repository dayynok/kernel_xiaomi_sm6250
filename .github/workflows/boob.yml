name: Build Karnal sur

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install deps
      run: |
        sudo apt update
        sudo apt upgrade
        sudo apt install -y python3 python3-pip git zip curl fastfetch

    
    - name: Fastfetch
      run: |
      fastfetch

    - name: Build PososalChlen1337
      run: |
        python3 build.py


    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: karnal
        path: |
          **/Image*
          **/*.zip